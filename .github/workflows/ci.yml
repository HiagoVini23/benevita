name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: benevita
          POSTGRES_PASSWORD: benevita
          POSTGRES_DB: benevita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benevita -d benevita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://benevita:benevita@localhost:5432/benevita?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check
