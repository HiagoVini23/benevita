services:
  db:
    image: postgres:17-alpine
    container_name: benevita-db
    environment:
      POSTGRES_USER: benevita
      POSTGRES_PASSWORD: benevita
      POSTGRES_DB: benevita
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - benevita-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U benevita -d benevita']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  benevita-db-data:
